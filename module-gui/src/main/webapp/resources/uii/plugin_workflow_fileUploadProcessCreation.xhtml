<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:p="http://primefaces.org/ui"
    xmlns:util="http://goobi.io/util">

    <composite:interface>
    </composite:interface>

    <composite:implementation>

		 <style>
			#upload .ui-widget-content {
				border: none;
			}

			#upload .ui-widget-header {
			    background: #fff none repeat scroll 0 0;
			}

			#upload .ui-fileupload-choose {
			    background: #368ee0 none repeat scroll 0 0;
			    color: #fff;
			    text-shadow: none;
			    border: 0 none;
			    padding: 0.3em 1em;
			    font-weight: 400;
			}

			#upload .ui-fileupload-buttonbar span.ui-button .ui-button-text {
			    padding: 0.3em 1em;
			}

			#upload .ui-fileupload-buttonbar span.ui-button span.ui-button-icon-left {
			    display: none;
			}

			#upload .ui-fileupload-files {
			    width: 100%;
			}

			.ui-fileupload-content .ui-progressbar {
			    width: 100px;
			    height: 20px;
			    margin: 0px;
			}

			#upload .ui-fileupload-files td:first-child {
			    display: none;
			}

			.draganddroparea {
				border: 2px dashed silver;
				padding-top:20px;

			}

			#upload .ui-fileupload-preview{
				display: none;
			}

		</style>

        <util:missing-rights rights="Plugin_Goobi_Massupload" />

        <ui:fragment rendered="#{LoginForm.hasRole('Plugin_Goobi_Massupload')}">
            <intranda:box
                id="uploadBox"
                boxTitle="false"
                boxType="action"
                boxPadding="false"
                boxClass="mb-3">
                <intranda:boxTitle
                    icon="plug"
                    title="#{msgs[NavigationForm.workflowPlugin.title]}" />

                <!-- Upload area -->
                <div class="p-3">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="draganddroparea">
                                <h:form id="uploadform" prependId="false">
                                    <p:fileUpload
                                        fileUploadListener="#{NavigationForm.workflowPlugin.uploadFile}"
                                        id="upload"
                                        auto="true"
                                        style="text-align:center;"
                                        mode="advanced"
                                        multiple="true"
                                        dragDropSupport="true"
                                        label="#{msgs.plugin_massupload_selectFiles}"
                                        sizeLimit="1000000000000"
                                        fileLimit="42000"
                                        allowTypes="#{NavigationForm.workflowPlugin.allowedTypes}"
                                        oncomplete="if(this.files.length == 0) sortFiles()"
                                        update="uploadBox:actionform" />
                                </h:form>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <h:form id="actionarea">
                                <p:remoteCommand
                                    name="sortFiles"
                                    actionListener="#{NavigationForm.workflowPlugin.sortFiles}"
                                    update="actionarea uploadBox:actionform" />
                                <h:panelGroup rendered="#{NavigationForm.workflowPlugin.uploadedFiles.size() > 0}">
                                    <div class="d-flex justify-content-end gap-2 mt-2">
                                        <h:commandLink
                                            title="#{msgs.abbrechen}"
                                            action="#{NavigationForm.workflowPlugin.cleanUploadFolder}"
                                            styleClass="btn btn-blank">
                                            <util:icon-text icon="trash" text="#{msgs.abbrechen}" />
                                        </h:commandLink>
                                        <h:commandLink
                                            title="#{msgs.plugin_massupload_startInserting}"
                                            rendered="#{NavigationForm.workflowPlugin.showInsertButton}"
                                            action="#{NavigationForm.workflowPlugin.startInserting}"
                                            styleClass="btn btn-action">
                                            <util:icon-text icon="settings" text="#{msgs.plugin_yerushaExcelImport_createProcesses}" />
                                        </h:commandLink>
                                    </div>
                                </h:panelGroup>
                            </h:form>
                        </div>
                    </div>
                </div>

                <!--  list of all uploaded files -->
                <h:panelGroup id="actionform" layout="block" styleClass="px-3">
                    <h:form
                        rendered="#{NavigationForm.workflowPlugin.uploadedFiles.size() > 0}"
                        id="uploadFilesTableForm">
                        <div class="gw-table gw-table-fixed">
                            <div class="gw-table__wrapper">
                                <h:dataTable
                                    var="item"
                                    value="#{NavigationForm.workflowPlugin.uploadedFiles}"
                                    id="files"
                                    styleClass="table table-hover table-bordered border-start border-end">
                                    <h:column>
                                        <f:facet name="header">
                                            <h:outputText value="#{msgs.datei}" />
                                        </f:facet>
                                        <h:outputText value="#{item.filename}" title="#{item.file.absolutePath}" />
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header">
                                            <h:outputText value="#{msgs.prozess}" />
                                        </f:facet>
                                        <h:outputText value="#{item.processTitle == null or item.processTitle eq ''?'-':item.processTitle}" title="#{item.processFolder}" />
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header">
                                            <h:outputText value="#{msgs.status}" />
                                        </f:facet>
                                        <h:outputText value="#{item.status}" title="#{item.statusmessage}" styleClass="badge #{item.status == 'OK' ? 'badge-intranda-green' : file.status == 'UNKNOWN'?'badge-intranda-orange':'badge-intranda-red'}" />
                                    </h:column>
                                    <h:column>
                                        <f:facet name="header">
                                            <h:outputText value="#{msgs.description}" />
                                        </f:facet>
                                        <h:outputText value="#{item.statusmessage}" />
                                    </h:column>
                                </h:dataTable>
                            </div>
                        </div>
                    </h:form>
                </h:panelGroup>
            </intranda:box>
        </ui:fragment>

        <script>
        	function startPolling() {
        		if(!window.massuploadInterval) {
        			console.log("start polling")
	        		window.massuploadInterval = setInterval(function() {
	        			console.log("polling...")
	        			var button = document.querySelector('#actionarea\\:plugin_massupload_hiddenAjaxRefresh');
	        			console.log("button", button)
	        			if(!button) {
	        				clearInterval(window.massuploadInterval);
	        				return;
	        			}
	        			button.click();
	        		}, 2000);
        		}
        	}
        	function onMassuploadAjax(e) {
        		console.log("onMassuploadAjax", e)
        		if(e.status === 'success') {
        			console.log("onmassuploadajax success");
        			startPolling();
        		}
        	}
        </script>

    </composite:implementation>

</ui:composition>
